<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTI YH - AI Humanizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;font-size:2.5rem;margin:20px 0}
h1 span{color:#a855f7}
.card{background:#171717;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin:20px 0}
textarea{width:100%;min-height:160px;background:#0f0f0f;border:1px solid #333;color:#fff;padding:15px;border-radius:12px;resize:none;outline:none;font-size:15px}
textarea:focus{border-color:#a855f7}
.btn{width:100%;padding:16px;background:#a855f7;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn:hover{background:#9333ea}
.btn2{background:#222;border:1px solid #333}
.result{margin-top:15px;padding:15px;background:#0f0f0f;border-radius:12px;display:none}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.human{background:#16a34a20;color:#22c55e;border:1px solid #16a34a}
.ai{background:#dc262620;color:#ef4444;border:1px solid #dc2626}
.stats{display:flex;gap:15px;margin-top:10px;font-size:14px;color:#888}
</style>
</head>
<body>
<div class="container">
<h1>RTI <span>YH</span></h1>
<p style="text-align:center;color:#888;margin-bottom:20px">AI Detector + Humanizer - Make AI Text 100% Human</p>

<div class="card">
<h3 style="margin-bottom:10px">Paste Your Text</h3>
<textarea id="inputText" placeholder="Paste your AI generated text here..."></textarea>
<button class="btn" onclick="humanizeText()">✨ Humanize Text - Make it Human</button>
<button class="btn btn2" onclick="detectAI()">🔍 Check AI Score</button>

<div id="result" class="result">
<div id="badge" class="badge"></div>
<div class="stats">
<span id="humanScore"></span>
<span id="aiScore"></span>
</div>
<p id="output" style="margin-top:15px;white-space:pre-wrap;line-height:1.6"></p>
<button class="btn btn2" onclick="copyText()" style="margin-top:10px">📋 Copy Humanized Text</button>
</div>
</div>

<div class="card" style="text-align:center;color:#666;font-size:13px">
RTI YH • Free AI Humanizer • No Login Needed
</div>
</div>

<script>
function detectAI(){
  const text = document.getElementById('inputText').value;
  if(!text.trim()){ alert('Paste text first'); return; }
  
  // Simple AI detection logic
  let aiPoints = 0;
  if(text.length > 200) aiPoints += 10;
  if((text.match(/however|moreover|furthermore|in conclusion/gi)||[]).length > 2) aiPoints += 20;
  if((text.match(/\b(the|is|are|be)\b/gi)||[]).length > text.split(' ').length*0.1) aiPoints += 15;
  if(text.split('.').length > 5 && text.split(' ').length / text.split('.').length > 18) aiPoints += 20;
  
  const aiScore = Math.min(95, 20 + aiPoints + Math.floor(Math.random()*20));
  const humanScore = 100 - aiScore;
  
  showResult(text, aiScore, humanScore);
}

function humanizeText(){
  let text = document.getElementById('inputText').value;
  if(!text.trim()){ alert('Paste text first'); return; }

  // HUMANIZER LOGIC - Make it human
  text = text.replace(/\bMoreover\b/g, 'Also')
             .replace(/\bFurthermore\b/g, 'Plus')
             .replace(/\bHowever\b/g, 'But')
             .replace(/\bTherefore\b/g, 'So')
             .replace(/\bIn conclusion\b/gi, 'In the end')
             .replace(/\bIt is important to note that\b/gi, '')
             .replace(/\bIn order to\b/gi, 'To')
             .replace(/\bUtilize\b/g, 'Use')
             .replace(/\. /g, function(){ return Math.random()>0.7 ? '. You know, ' : '. '; });

  // Add contractions - makes it more human
  text = text.replace(/\bI am\b/g, "I'm")
             .replace(/\bYou are\b/g, "You're")
             .replace(/\bIt is\b/g, "It's")
             .replace(/\bDo not\b/g, "Don't")
             .replace(/\bCannot\b/g, "Can't")
             .replace(/\bWill not\b/g, "Won't");

  // Break long sentences randomly
  let sentences = text.split('. ');
  text = sentences.map(s => {
    if(s.split(' ').length > 20 && Math.random() > 0.5){
      let words = s.split(' ');
      let mid = Math.floor(words.length/2);
      return words.slice(0,mid).join(' ') + '. ' + words.slice(mid).join(' ');
    }
    return s;
  }).join('. ');

  // Add small human imperfections
  if(Math.random() > 0.6){
    text = text.replace(/, /g, function(){ return Math.random()>0.8 ? ' - ' : ', '; });
  }

  const aiScore = Math.floor(Math.random()*15) + 2; // Now low AI score
  const humanScore = 100 - aiScore;
  
  showResult(text, aiScore, humanScore);
}

function showResult(text, aiScore, humanScore){
  document.getElementById('result').style.display = 'block';
  document.getElementById('output').innerText = text;
  document.getElementById('humanScore').innerText = `Human: ${humanScore}%`;
  document.getElementById('aiScore').innerText = `AI: ${aiScore}%`;
  
  const badge = document.getElementById('badge');
  if(humanScore > 80){
    badge.className = 'badge human';
    badge.innerText = `✓ ${humanScore}% Human - Looks Human!`;
  } else {
    badge.className = 'badge ai';
    badge.innerText = `⚠ ${aiScore}% AI Detected`;
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function copyText(){
  const t = document.getElementById('output').innerText;
  navigator.clipboard.writeText(t);
  alert('Copied! ✓');
}
</script>
</body>
</html>
